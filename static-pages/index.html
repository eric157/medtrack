<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MedTrack — Smart Family Medication PWA</title>
  <meta name="description" content="Family medication tracking for parents and caregivers. Open source project page on GitHub Pages." />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #064e3b 100%);
      color: #fff;
      padding: 2rem;
    }
    .card {
      max-width: 480px;
      text-align: center;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      backdrop-filter: blur(8px);
    }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    p { color: #cbd5e1; margin-bottom: 1rem; line-height: 1.6; }
    .note {
      font-size: 0.875rem;
      color: #94a3b8;
      margin-bottom: 1.5rem;
    }
    a {
      display: inline-block;
      background: #10b981;
      color: #fff;
      font-weight: 700;
      padding: 0.875rem 1.75rem;
      border-radius: 0.75rem;
      text-decoration: none;
      margin: 0.25rem;
    }
    a.secondary { background: rgba(255,255,255,0.12); }
    .links { margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>MedTrack</h1>
    <p>Smart family medication tracking for parents and caregivers.</p>
    <p class="note">This GitHub Pages site is the project landing page. The live app runs separately on Vercel.</p>
    <a href="https://medtrack-flame.vercel.app/">Open live app →</a>
    <div class="links">
      <a class="secondary" href="https://github.com/eric157/medtrack">GitHub repo</a>
      <a class="secondary" href="https://medtrack-flame.vercel.app/kiosk">Parent Kiosk</a>
      <a class="secondary" href="https://medtrack-flame.vercel.app/dashboard">Dashboard</a>
    </div>
  </div>
</body>
</html>
